version: '3.8'
services:
  postgres:
    image: postgres:17-alpine
    container_name: petshop-postgres
    environment:
      POSTGRES_DB: petshop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - petshop-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d petshop"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  petshop-pgdata: