<ng-template #conteudo>
  <form nz-form nzLayout="vertical" [formGroup]="form" (ngSubmit)="salvar()">
    @if (modalRef) {
      <div nz-row [nzGutter]="[24, 0]">
        <div nz-col [nzXs]="24">
          <nz-form-item>
            <nz-form-label nzRequired nzFor="nome">Nome</nz-form-label>
            <nz-form-control nzErrorTip="Informe o nome (até 150 caracteres).">
              <input nz-input id="nome" formControlName="nome" maxlength="150" />
            </nz-form-control>
          </nz-form-item>
        </div>
        <div nz-col [nzXs]="24">
          <nz-form-item>
            <nz-form-label nzFor="descricao">Descrição</nz-form-label>
            <nz-form-control nzErrorTip="Até 500 caracteres.">
              <textarea
                nz-input
                id="descricao"
                formControlName="descricao"
                rows="3"
                maxlength="500"
              ></textarea>
            </nz-form-control>
          </nz-form-item>
        </div>
        <div nz-col [nzXs]="12" [nzMd]="8">
          <nz-form-item>
            <nz-form-label nzRequired nzFor="preco">Preço</nz-form-label>
            <nz-form-control nzErrorTip="Entre 0,01 e 9.999,99.">
              <nz-input-group nzAddOnBefore="R$">
                <input
                  nz-input
                  id="preco"
                  formControlName="preco"
                  appMoeda
                  [maximo]="9999.99"
                  placeholder="0,00"
                />
              </nz-input-group>
            </nz-form-control>
          </nz-form-item>
        </div>
        <div nz-col [nzXs]="12" [nzMd]="8">
          <nz-form-item>
            <nz-form-label nzFor="tempoEstimadoMinutos">Duração estimada (min)</nz-form-label>
            <nz-form-control nzErrorTip="Não pode ser negativa.">
              <nz-input-number
                nzId="tempoEstimadoMinutos"
                formControlName="tempoEstimadoMinutos"
                [nzMin]="0"
                [nzStep]="5"
                [nzPrecision]="0"
              />
            </nz-form-control>
          </nz-form-item>
        </div>
      </div>
    } @else {
      <nz-card>
        <div nz-row [nzGutter]="[24, 0]">
          <div nz-col [nzXs]="24">
            <nz-form-item>
              <nz-form-label nzRequired nzFor="nome">Nome</nz-form-label>
              <nz-form-control nzErrorTip="Informe o nome (até 150 caracteres).">
                <input nz-input id="nome" formControlName="nome" maxlength="150" />
              </nz-form-control>
            </nz-form-item>
          </div>
          <div nz-col [nzXs]="24">
            <nz-form-item>
              <nz-form-label nzFor="descricao">Descrição</nz-form-label>
              <nz-form-control nzErrorTip="Até 500 caracteres.">
                <textarea
                  nz-input
                  id="descricao"
                  formControlName="descricao"
                  rows="3"
                  maxlength="500"
                ></textarea>
              </nz-form-control>
            </nz-form-item>
          </div>
          <div nz-col [nzXs]="12" [nzMd]="8">
            <nz-form-item>
              <nz-form-label nzRequired nzFor="preco">Preço</nz-form-label>
              <nz-form-control nzErrorTip="Entre 0,01 e 9.999,99.">
                <nz-input-group nzAddOnBefore="R$">
                  <input
                    nz-input
                    id="preco"
                    formControlName="preco"
                    appMoeda
                    [maximo]="9999.99"
                    placeholder="0,00"
                  />
                </nz-input-group>
              </nz-form-control>
            </nz-form-item>
          </div>
          <div nz-col [nzXs]="12" [nzMd]="8">
            <nz-form-item>
              <nz-form-label nzFor="tempoEstimadoMinutos">Duração estimada (min)</nz-form-label>
              <nz-form-control nzErrorTip="Não pode ser negativa.">
                <nz-input-number
                  nzId="tempoEstimadoMinutos"
                  formControlName="tempoEstimadoMinutos"
                  [nzMin]="0"
                  [nzStep]="5"
                  [nzPrecision]="0"
                />
              </nz-form-control>
            </nz-form-item>
          </div>
        </div>
      </nz-card>
    }

    <div class="form-actions">
      @if (modalRef) {
        <button nz-button type="button" (click)="modalRef.close()">Cancelar</button>
      } @else {
        <a nz-button routerLink="/servicos">Cancelar</a>
      }
      <button nz-button nzType="primary" type="submit" [nzLoading]="salvando()">Salvar</button>
    </div>
  </form>
</ng-template>

@if (modalRef) {
  <ng-container *ngTemplateOutlet="conteudo" />
} @else {
  <app-pagina [titulo]="titulo()" [trilha]="trilha()">
    <ng-container *ngTemplateOutlet="conteudo" />
  </app-pagina>
}
