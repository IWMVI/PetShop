# Testes do back-end (JUnit, integração e Cucumber) a cada push e pull request.
name: Back-end

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes (Gradle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Configurar Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      # Os testes usam H2 em modo PostgreSQL (perfil test): não precisam de banco externo.
      - name: Rodar testes
        run: ./gradlew test

      - name: Publicar relatório de testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-backend
          path: backend/build/reports/tests/test
          retention-days: 7
