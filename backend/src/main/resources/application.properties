spring.application.name=PetShop
spring.profiles.default=dev
# Escuta em todas as interfaces de rede, permitindo acesso por outros dispositivos da rede local.
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}
# Tutores excluídos (soft delete) há mais de N dias são removidos definitivamente.
petshop.expurgo-tutores.dias-retencao=30
# Horário do expurgo (cron do Spring: seg min hora dia mês dia-da-semana). Padrão: todo dia às 03:00.
petshop.expurgo-tutores.cron=0 0 3 * * *
